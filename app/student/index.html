<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2557">
  <meta name="robots" content="noindex, nofollow">
  <title>Student Dashboard · Ebenezer Higher Secondary School</title>
  <link rel="icon" href="/media/logo">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/app-shared/shell.css?v=2">
  <script src="/assets/js/guard.js" defer></script>
  <script src="/app-shared/chat.js?v=2" defer></script>
  <script src="/app-shared/session.js?v=2" defer></script>
</head>
<body class="dash">
  <div class="dash-frame">
    <!-- Blueprint Header: Profile on left, Welcome in middle, 3-line Menu + School Logo on right -->
    <header class="bp-header">
      <button type="button" class="bp-profile-col" id="OpenProfileBtn" title="View my profile">
        <div class="bp-avatar-wrap">
          <img id="avatar" class="bp-avatar" src="/assets/img/avatar.svg" alt="Profile picture" width="78" height="78">
        </div>
        <span class="bp-profile-label">Profile</span>
      </button>

      <div class="bp-welcome-col">
        <h1 class="bp-welcome-title" id="welcome-heading">Welcome Students!</h1>
        <p class="bp-user-name" id="user-name">Loading…</p>
        <span class="bp-chat-badge" id="chat-id-badge">Chat ID: …</span>
      </div>

      <div class="bp-right-col">
        <button type="button" class="bp-menu-btn" id="menu-open" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div class="bp-school-logo" title="Ebenezer Higher Secondary School">
          <img src="/media/logo" alt="School Logo" width="74" height="74">
        </div>
      </div>
    </header>

    <!-- Main Blueprint Icon Grid -->
    <main class="bp-main" id="bp-main">
      <div class="bp-grid" id="bp-grid" aria-live="polite"></div>
    </main>

    <!-- Sub-Page View (Profile, Setting, Coming Soon, Notices, School Group Chat) -->
    <section class="subview" id="subview" aria-live="polite">
      <div class="subview-bar">
        <button type="button" class="subview-back" id="subview-back">← Back</button>
        <h2 class="subview-title" id="subview-title">Section</h2>
      </div>
      <div class="subview-content" id="subview-content"></div>
    </section>
  </div>

  <!-- Top-Right Slide-Out Menu Drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <img id="drawer-avatar" src="/assets/img/avatar.svg" alt="Profile" width="48" height="48">
      <div class="drawer-head-text">
        <strong id="drawer-name">Student</strong>
        <small id="drawer-role">Student</small>
      </div>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="drawer-nav" aria-label="User menu">
      <button type="button" class="drawer-btn" id="drawer-profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        Profile
      </button>
      <button type="button" class="drawer-btn" id="drawer-setting">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Setting
      </button>
      <button type="button" class="drawer-btn" id="drawer-privacy">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>
        Privacy &amp; Policy
      </button>
      <button type="button" class="drawer-btn" id="drawer-terms">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>
        Terms &amp; Condition
      </button>
      <button type="button" class="drawer-btn danger" id="drawer-logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </nav>
  </aside>
</body>
</html>
